name: Build

on:
  push:
    paths-ignore:
      - '.{gitignore,gitattributes}'
      - '.travis.yml'
  pull_request:
    paths-ignore:
      - '.{gitignore,gitattributes}'
      - '.travis.yml'

jobs:
  build-windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild.exe cli/maxcso.sln -m -p:Configuration=Release -p:Platform=x64 -p:TrackFileAccess=false

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: maxcso-windows-nonpgo
          path: |
            maxcso.exe
            lib/x64/Release/mCSO.dll
            lib/x64/Release/mCSO.lib
            capi/maxcso_capi.h

  build-macos:
    name: macOS build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: brew install libuv lz4 pkg-config

      - name: Build
        run: |
          make -j3 all lib
          tar cv maxcso mCSO.dylib capi/maxcso_capi.h | gzip -9 > maxcso-macos.tar.gz

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: maxcso-macos
          path: maxcso-macos.tar.gz

  build-ubuntu:
    name: Ubuntu build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev liblz4-dev

      - name: Build
        run: |
          make -j4 all lib
          tar cv maxcso mCSO.so capi/maxcso_capi.h | gzip -9 > maxcso-linux.tar.gz

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: maxcso-linux
          path: maxcso-linux.tar.gz
