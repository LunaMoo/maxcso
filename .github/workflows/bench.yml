name: cso_bench

on:
  push:
    branches: [ bench/compression-trials ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows cso_bench.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build compressor libraries
        run: msbuild.exe cli/maxcso.sln -m -p:Configuration=Release -p:Platform=x64 -p:TrackFileAccess=false

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build cso_bench.exe
        shell: cmd
        run: |
          dir cli\Release\x64\lib
          cl /nologo /O2 /MT /EHsc /std:c++17 /utf-8 /DNDEBUG /Izlib /Izopfli\src\zopfli /I7zip /Ilibdeflate bench\cso_bench.cpp /Fe:cso_bench.exe /link cli\Release\x64\lib\zlib.lib cli\Release\x64\lib\zopfli.lib cli\Release\x64\lib\7zip.lib cli\Release\x64\lib\libdeflate.lib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cso_bench-windows
          path: |
            cso_bench.exe
            bench/run_bench.bat
