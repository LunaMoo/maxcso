name: cso_bench

on:
  push:
    branches: [ bench/compression-trials ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows cso_bench.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build compressor libraries
        run: msbuild.exe cli/maxcso.sln -m -p:Configuration=Release -p:Platform=x64 -p:TrackFileAccess=false

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build cso_bench.exe
        shell: cmd
        run: |
          dir cli\Release\x64\lib > build_log.txt 2>&1
          cl /nologo /O2 /MT /EHsc /std:c++17 /utf-8 /DNDEBUG /Izlib /Izopfli\src\zopfli /I7zip /Ilibdeflate bench\cso_bench.cpp /Fe:cso_bench.exe /link cli\Release\x64\lib\zlib.lib cli\Release\x64\lib\zopfli.lib cli\Release\x64\lib\7zip.lib cli\Release\x64\lib\libdeflate.lib >> build_log.txt 2>&1
          if errorlevel 1 goto done
          cl /nologo /O2 /MT /EHsc /std:c++17 /utf-8 /DNDEBUG /Izlib /Izopfli\src\zopfli /Ilibdeflate bench\cso_full.cpp /Fe:cso_full.exe /link cli\Release\x64\lib\zlib.lib cli\Release\x64\lib\zopfli.lib cli\Release\x64\lib\libdeflate.lib >> build_log.txt 2>&1
          if errorlevel 1 goto done
          cl /nologo /O2 /MT /EHsc /std:c++17 /utf-8 /DNDEBUG /Izlib bench\img_bench.cpp /Fe:img_bench.exe /link cli\Release\x64\lib\zlib.lib >> build_log.txt 2>&1
          :done
          set RC=%ERRORLEVEL%
          type build_log.txt
          exit /b %RC%

      - name: Publish build log to ci-logs branch
        if: always()
        shell: bash
        run: |
          cp build_log.txt /tmp/build_log.txt 2>/dev/null || echo "no log" > /tmp/build_log.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs
          git rm -rq --cached . 
          cp /tmp/build_log.txt build_log.txt
          git add build_log.txt && git commit -qm "build log ${{ github.sha }}"
          git push -f origin ci-logs

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cso_bench-windows
          path: |
            cso_bench.exe
            cso_full.exe
            img_bench.exe
            bench/run_img.bat
            bench/run_bench.bat
            bench/run_full.bat
